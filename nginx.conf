# Cache: pages always revalidate (so an update shows at once); styles,
# scripts and images are kept for a week.
map $sent_http_content_type $oxy_expires {
    default                   off;
    ~text/html                epoch;
    text/css                  7d;
    application/javascript    7d;
    ~image/                   30d;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    expires $oxy_expires;

    # Requests arrive from the cloudflared container; log the visitor's real
    # address, which Cloudflare puts in CF-Connecting-IP. nginx publishes no
    # port (see docker-compose.yml), so only the tunnel can reach it.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only this site's own files, plus Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
